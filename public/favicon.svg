<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="#060a14" stroke="url(#cyberGrad)" stroke-width="2.5" />

  <!-- Terminal Chevron Prompt '>' -->
  <path d="M 21 21 L 32 32 L 21 43" stroke="#00ff88" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Terminal Underscore Cursor '_' -->
  <line x1="36" y1="43" x2="47" y2="43" stroke="#00ff88" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Live Pulse Status Dot on Bottom Right -->
  <circle cx="51" cy="51" r="7" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.5" />
  <circle cx="51" cy="51" r="4" fill="#00ff88" />
</svg>

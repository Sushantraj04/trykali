<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TryKali — Interactive Cybersecurity Labs & Terminal Platform</title>
    <meta name="description" content="Learn cybersecurity with hands-on in-browser terminal practice, 600+ Kali Linux tools, guided CTF rooms, and AI cyber mentor." />
    
    <!-- Professional Google Fonts: Plus Jakarta Sans (Headings/UI) + JetBrains Mono (Terminal & Code) + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: '#05070c',
                card: '#0c101a',
                cardHover: '#111726',
                border: '#1a2333',
                borderHighlight: '#2a3b54',
                green: '#00ff88',
                greenDim: '#00cc6a',
                greenGlow: 'rgba(0, 255, 136, 0.35)',
                cyan: '#00e5ff',
                cyanGlow: 'rgba(0, 229, 255, 0.35)',
                red: '#ff3366',
                yellow: '#ffbb00',
                purple: '#b026ff',
                text: '#f1f5f9',
                muted: '#94a3b8'
              }
            },
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        background-color: #05070c;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Professional Code Typography */
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
        font-feature-settings: "calt" 1, "liga" 1;
      }

      /* Custom Cyber Glowing Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #05070c;
      }
      ::-webkit-scrollbar-thumb {
        background: #1a2333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00ff88;
        box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      }

      /* Glow Utilities */
      .neon-glow-green {
        text-shadow: 0 0 12px rgba(0, 255, 136, 0.45);
      }
      .neon-glow-cyan {
        text-shadow: 0 0 12px rgba(0, 229, 255, 0.45);
      }
      .neon-border-green {
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.12);
      }
      .glass-card {
        background: rgba(12, 16, 26, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(26, 35, 51, 0.8);
      }
    </style>
  </head>
  <body class="bg-[#05070c] min-h-screen text-slate-100 overflow-x-hidden relative selection:bg-cyber-green selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
